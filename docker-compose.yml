# ==============================================================================
# Suchak (सूचक) — Local & Staging Docker Compose
# ==============================================================================
# NOTE FOR LARAVEL HERD USERS:
# Since local development runs natively via Laravel Herd (http://suchak.test),
# you can spin up ONLY the companion database, cache, and sidecar services with:
#
#   docker compose up -d postgres redis minio ingestion-worker n8n
#
# If running the entire stack via Docker (including Laravel web & worker):
#
#   docker compose up -d
# ==============================================================================

services:
  # ============================================================================
  # 1. Suchak Core Web Application (Inertia v2 + Svelte 5 + Nginx + PHP 8.4-FPM)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: suchak/app:latest
    container_name: suchak_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8002}:80"
    environment:
      CONTAINER_ROLE: web
      AUTO_MIGRATE: "true"
      APP_NAME: "Suchak"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8002}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-suchak_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: s3
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-suchak-artifacts}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      INGESTION_WORKER_URL: http://ingestion-worker:8001
      INGESTION_WORKER_API_KEY: ${INGESTION_WORKER_API_KEY:-internal-dev-token}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/notice-published
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-n8n-secret-key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ingestion-worker:
        condition: service_healthy
    networks:
      - suchak-net

  # ============================================================================
  # 2. Suchak Queue Worker
  # ============================================================================
  queue-worker:
    image: suchak/app:latest
    container_name: suchak_worker
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: worker
      APP_NAME: "Suchak"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-suchak_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FILESYSTEM_DISK: s3
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_BUCKET: ${AWS_BUCKET:-suchak-artifacts}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      INGESTION_WORKER_URL: http://ingestion-worker:8001
      INGESTION_WORKER_API_KEY: ${INGESTION_WORKER_API_KEY:-internal-dev-token}
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - suchak-net

  # ============================================================================
  # 3. Suchak Scheduler (Cron daemon)
  # ============================================================================
  scheduler:
    image: suchak/app:latest
    container_name: suchak_scheduler
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: scheduler
      APP_NAME: "Suchak"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-suchak_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      app:
        condition: service_started
    networks:
      - suchak-net

  # ============================================================================
  # 4. Suchak Python Ingestion & OCR Sidecar (FastAPI + Docling + PaddleOCR)
  # ============================================================================
  ingestion-worker:
    build:
      context: .
      dockerfile: docker/ingestion/Dockerfile
    image: suchak/ingestion-worker:latest
    container_name: suchak_ingestion_worker
    restart: unless-stopped
    ports:
      - "${INGESTION_PORT:-8001}:8001"
    environment:
      PORT: 8001
      WORKERS: 2
      API_KEY: ${INGESTION_WORKER_API_KEY:-internal-dev-token}
      AWS_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_BUCKET: ${AWS_BUCKET:-suchak-artifacts}
    networks:
      - suchak-net

  # ============================================================================
  # 5. Primary Database: PostgreSQL 17
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: suchak_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-suchak_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-suchak_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suchak-net

  # ============================================================================
  # 6. Cache & Queues: Redis 7.4
  # ============================================================================
  redis:
    image: redis:7.4-alpine
    container_name: suchak_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - suchak-net

  # ============================================================================
  # 7. Local S3 Object Store: MinIO
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: suchak_minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - suchak-net

  # ============================================================================
  # 8. External Automation & Broadcast: n8n
  # ============================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: suchak_n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8ndata:/home/node/.n8n
    networks:
      - suchak-net

# ==============================================================================
# Volumes & Networks
# ==============================================================================
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  miniodata:
    driver: local
  n8ndata:
    driver: local

networks:
  suchak-net:
    driver: bridge
